  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  m3_expressive: 1.0.0
  material_color_utilities: ^0.13.0
  meta: ^1.16.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
