name: atrium
description: Atrium - mobile controller for a self-hosted media stack.
publish_to: none
resolution: workspace
version: 1.6.1+22

environment:
  sdk: ^3.6.0
  flutter: ^3.27.0

dependencies:
  collection: ^1.18.0
  connectivity_plus: ^7.2.0
  core_models:
  core_networking:
  core_profile:
  core_router:
  core_storage:
  core_ui:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  file_picker: ^12.0.0-beta.7
  palette_generator_plus: ^1.0.0
  material_color_utilities: ^0.13.0
  path_provider: ^2.1.5
  intl: ^0.20.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  hive_ce: ^2.10.1
  # M3 Expressive determinate circular/linear gauges (progress_indicator_m3e
  # is path-overridden to packages/progress_indicator_m3e_fixed at the root).
  m3e_design: 0.2.1
  progress_indicator_m3e: ^0.1.1
  service_bazarr:
  service_deluge:
  service_emby:
  service_jellyfin:
  service_nzbget:
  service_seerr:
  service_plex:
  service_prowlarr:
  service_qbittorrent:
  service_radarr:
  service_sabnzbd:
  service_sonarr:
  service_glances:
  service_beszel:
  service_dashdot:
  service_speedtest_tracker:
  service_tautulli:
  service_rtorrent:
  service_transmission:
  service_tracearr: ^0.0.0
  service_lidarr:
  service_unraid:
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/service_icons/
    - assets/glyphs/
  fonts:
    - family: JetBrainsMono Nerd Font
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFont-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/atrium_icon.png"
  adaptive_icon_background: "#6750A4"
  adaptive_icon_foreground: "assets/icon/atrium_foreground.png"
  adaptive_icon_monochrome: "assets/icon/atrium_foreground.png"
  min_sdk_android: 23
